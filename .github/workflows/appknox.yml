# Optional mobile security scan via Appknox (requires APPKNOX_ACCESS_TOKEN secret).
# See https://www.appknox.com/ — without a token, the scan step is skipped.

name: Appknox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  appknox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Appknox GitHub action
        id: appknox
        continue-on-error: true
        uses: appknox/appknox-github-action@b7d2bfb2321d5544e97bffcba48557234ab953a4
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/apk/debug/app-debug.apk
          risk_threshold: MEDIUM
          sarif: Enable

      - name: Upload SARIF to GHAS
        if: steps.appknox.outcome == 'success' && hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif
