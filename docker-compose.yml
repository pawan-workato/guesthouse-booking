services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guesthouse
      POSTGRES_PASSWORD: guesthouse
      POSTGRES_DB: guesthouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guesthouse -d guesthouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/guesthouse
      DATABASE_USER: guesthouse
      DATABASE_PASSWORD: guesthouse
      JWT_SECRET: dev-secret-change-me-in-production
      JWT_ISSUER: guesthouse-booking
      JWT_AUDIENCE: guesthouse-staff
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
